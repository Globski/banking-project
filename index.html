<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nanabank Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  display: flex;
  height: 100vh;
  background: #f5f7fb;
}

/* LEFT SIDE */
.left {
  flex: 1;
  background: linear-gradient(135deg, #0a1f44, #1c3faa, #3b82f6);
  color: white;
  padding: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.left h1 {
  font-size: 42px;
  margin-bottom: 20px;
}

.left p {
  font-size: 18px;
  line-height: 1.6;
  opacity: 0.9;
}

.store-buttons {
  margin-top: 30px;
}

.store-buttons img {
  width: 150px;
  margin-right: 10px;
  cursor: pointer;
}

/* RIGHT SIDE */
.right {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-card {
  width: 350px;
  padding: 40px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}

.login-card h2 {
  margin-bottom: 25px;
  color: #0a1f44;
}

.input-group {
  margin-bottom: 20px;
}

.input-group input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  outline: none;
  transition: 0.3s;
}

.input-group input:focus {
  border-color: #3b82f6;
}

.forgot {
  text-align: right;
  font-size: 14px;
  margin-bottom: 20px;
}

.forgot a {
  text-decoration: none;
  color: #3b82f6;
}

.login-btn {
  width: 100%;
  padding: 12px;
  background: #3b82f6;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.login-btn:hover {
  background: #2563eb;
}

.extra-links {
  margin-top: 20px;
  font-size: 14px;
  text-align: center;
}

.extra-links a {
  display: block;
  margin-top: 8px;
  text-decoration: none;
  color: #0a1f44;
  font-weight: 500;
}

.terms {
  font-size: 12px;
  margin-bottom: 15px;
  color: #555;
}
</style>

</head>

<body>

<!-- LEFT -->
<div class="left">
  <h1>Welcome to Nanabank Online</h1>
  <p>
    Check your balance, make transfers and payments instantly.<br>
    Do it all on mobile too with the new Nanabank app.
  </p>

  <div class="store-buttons">
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
    <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg">
  </div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="login-card">
    <h2>Login</h2>

    <div class="input-group">
      <input type="text" placeholder="Username">
    </div>

    <div class="input-group">
      <input type="password" placeholder="Password">
    </div>

    <div class="forgot">
      <a href="#">Forgot Password?</a>
    </div>

    <p class="terms">
      By logging in, you agree to the Terms & Conditions and Privacy Policy
    </p>

    <button class="login-btn">Log in</button>

    <div class="extra-links">
      <a href="#">Register for Internet Banking</a>
      <a href="#">New to Nanabank? Open an Account</a>
    </div>
  </div>
</div>

</body>
</html>
